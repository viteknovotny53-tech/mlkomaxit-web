[build]
  command = "npm run build"
  publish = "_site"
  # Web běží jako projekt mlkomaxit-navrh (tým vitek project), kde jde zdarma vypnout odznak Netlify.
  # Projekt ml-komaxit na účtu ML komaxit už nestavíme: exit 0 = build přeskočen, deploy nespotřebuje kredity.
  ignore = "test \"$SITE_NAME\" = \"ml-komaxit\""

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
