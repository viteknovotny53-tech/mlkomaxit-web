[build]
  command = "npm run build"
  publish = "_site"
  # Web běží jen jako projekt mlkomaxit (tým ATC jadran). Ostatní projekty napojené na tohle repo
  # (mlkomaxit-navrh, ml-komaxit) build přeskočí: exit 0 = přeskočeno, deploy nespotřebuje kredity.
  ignore = "test \"$SITE_NAME\" != \"mlkomaxit\""

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Stará adresa na Netlify trvale přesměruje na doménu, ať Google nevidí dvě kopie webu
[[redirects]]
  from = "https://mlkomaxit.netlify.app/*"
  to = "https://ml-komaxit.cz/:splat"
  status = 301
  force = true
