[build]
  command = "npm run build"
  publish = "_site"
  # Web běží jen jako projekt mlkomaxit (tým ATC jadran). Ostatní projekty napojené na tohle repo
  # (mlkomaxit-navrh, ml-komaxit) build přeskočí: exit 0 = přeskočeno, deploy nespotřebuje kredity.
  ignore = "test \"$SITE_NAME\" != \"mlkomaxit\""

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
