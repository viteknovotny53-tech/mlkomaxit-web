# Pages CMS – administrace webu M&L komaxit (https://app.pagescms.org)
# Klient upravuje jen obsah v src/_data a fotky v src/img/uploads.

media:
  input: src/img/uploads
  output: /img/uploads
  categories: [image]
  rename: safe

content:
  - name: uvod
    label: Úvod
    type: file
    path: src/_data/uvod.json
    format: json
    fields:
      - name: headline
        label: Hlavní nadpis
        type: string
        required: true
      - name: lead
        label: Text pod nadpisem
        type: text
        description: Stačí dvě krátké věty, ať se úvod vejde na obrazovku.
      - name: videoAlt
        label: Popis animace v úvodu (pro nevidomé a Google)
        type: string

  - name: sluzby
    label: Služby
    type: file
    path: src/_data/sluzby.json
    format: json
    fields:
      - name: heading
        label: Nadpis sekce
        type: string
      - name: intro
        label: Úvodní text
        type: text
      - name: items
        label: Služby
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Název služby
            type: string
            required: true
          - name: text
            label: Krátký popis
            type: text
          - name: icon
            label: Ikona
            type: select
            options:
              values:
                - name: lakovani
                  label: Sprej (lakování)
                - name: odlakovani
                  label: Baňka (chemie)
                - name: tryskani
                  label: Proud vzduchu (tryskání)
                - name: cisteni
                  label: Kapka (čištění vodou a laserem)
                - name: renovace
                  label: Kolo
                - name: svarovani
                  label: Klíč (opravy)
                - name: serie
                  label: Vrstvy (série)
                - name: pristup
                  label: Člověk (osobní přístup)
                - name: svoz
                  label: Nákladní auto (svoz)
      - name: fitsHeading
        label: Nadpis rámečku „Co u nás nalakujete“
        type: string
      - name: fits
        label: Co u nás nalakujete
        type: string
        list: true
      - name: fitsNote
        label: Poznámka pod seznamem
        type: string

  - name: realizace
    label: Realizace (galerie)
    type: file
    path: src/_data/realizace.json
    format: json
    fields:
      - name: intro
        label: Úvodní věta
        type: string
        description: Za ni se automaticky doplní odkazy na Facebook a Instagram. Pořadí fotek níže změníte přetažením – horní je v galerii první.
      - name: items
        label: Fotky realizací
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: image
            label: Fotka
            type: image
            required: true
          - name: title
            label: Nadpis
            type: string
            required: true
          - name: text
            label: Krátký popis
            type: string
          - name: alt
            label: Co je na fotce (pro nevidomé a Google)
            type: string

  - name: vyzva
    label: Pruh s výzvou (za galerií)
    type: file
    path: src/_data/vyzva.json
    format: json
    fields:
      - name: heading
        label: Nadpis
        type: string
        description: Velký nadpis v pruhu s barevným práškem, třeba vaše krédo.
      - name: text
        label: Text
        type: text

  - name: postup
    label: Jak to probíhá
    type: file
    path: src/_data/postup.json
    format: json
    fields:
      - name: intro
        label: Úvodní věta
        type: string
      - name: steps
        label: Kroky
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {title}"
        fields:
          - name: title
            label: Název kroku
            type: string
            required: true
          - name: text
            label: Popis
            type: text

  - name: site
    label: Kontakt a firma
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: name
        label: Název firmy
        type: string
      - name: person
        label: Kontaktní osoba
        type: string
      - name: phone
        label: Telefon
        type: string
        description: Ve tvaru +420 799 040 499
      - name: email
        label: E-mail
        type: string
      - name: street
        label: Ulice a číslo
        type: string
      - name: city
        label: PSČ a obec
        type: string
      - name: hours
        label: Provozní doba
        type: string
        description: Třeba „Po–Pá 7–16“ nebo „Vždy po domluvě“. Když necháte prázdné, řádek se nezobrazí.
      - name: ico
        label: IČO
        type: string
      - name: legalName
        label: Podnikatel (jméno podle živnostenského rejstříku)
        type: string
        description: Zobrazí se v patičce a v zásadách ochrany osobních údajů jako provozovatel webu.
      - name: seat
        label: Sídlo podle rejstříku
        type: string
        description: Celá adresa na jednom řádku, třeba „Malá Čermná 26, 517 25 Čermná nad Orlicí“.
      - name: registry
        label: Zápis v rejstříku
        type: string
        description: Píše se do patičky za sídlo, třeba „zapsaný v živnostenském rejstříku“.
      - name: contactText
        label: Text v sekci Kontakt
        type: text
      - name: facebook
        label: Odkaz na Facebook
        type: string
      - name: instagram
        label: Instagram (jen jméno účtu bez @)
        type: string
      - name: title
        label: Titulek stránky (Google, záložka prohlížeče)
        type: string
      - name: description
        label: Popis stránky pro Google
        type: text
      - name: url
        label: Adresa webu
        type: string
        description: Neměňte, dokud web nepoběží na vlastní doméně (pak sem patří třeba https://www.mlkomaxit.cz).
